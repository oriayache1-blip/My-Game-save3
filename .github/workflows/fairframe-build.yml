name: Build FairFrame

on:
  workflow_dispatch:
  push:
    branches:
      - fairframe-build

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Geode package
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build FairFrame
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          path: FairFrame

      - name: Upload installable Geode mod
        uses: actions/upload-artifact@v4
        with:
          name: FairFrame-Windows-geode
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
